name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs layout
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.changes.outputs.build }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      # A pull request that only changes Markdown (docs/ or any *.md) skips the Linux and Windows
      # builds; they show as skipped. Pushes to master always build, so the lightscreen-win64
      # artifact used for Windows QA stays current.
      - name: Decide whether the builds run
        id: changes
        run: |
          build=true
          if [ "${{ github.event_name }}" = pull_request ]; then
            # The checkout is GitHub's merge commit; its first parent is the base branch.
            files="$(git diff --name-only HEAD^1 HEAD)"
            if [ -n "$files" ] && ! grep -qvE '^docs/|\.md$' <<< "$files"; then
              build=false
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Builds run: $build"
      - name: Check one-file-per-entry layout
        run: .github/scripts/check-docs.sh
      - name: Include-graph check (tools/ includes no dialogs/ or widgets/)
        run: tests/check-includes.sh

  linux:
    name: Linux (Qt 6.8, GCC)
    needs: docs
    if: needs.docs.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          # Build: X11/xcb headers and OpenGL headers (QtGui's build files reference them).
          # Run: the xcb libraries Qt's xcb platform plugin loads (aqt's Qt does not pull them in).
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libgl-dev libegl-dev libx11-dev libxcb-keysyms1-dev \
            libfontconfig1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            ninja-build xvfb xdotool optipng

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      # oxipng has no apt package on Ubuntu 24.04; build it once and cache the binary. With optipng from apt,
      # tst_optimizer's realTool runs against both tools.
      - name: Cache oxipng
        id: oxipng-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/oxipng
          key: oxipng-10.2.1-${{ runner.os }}

      - name: Install oxipng
        if: steps.oxipng-cache.outputs.cache-hit != 'true'
        run: cargo install oxipng --version 10.2.1 --locked

      - name: Build (app and tests)
        run: |
          cmake --preset linux-release
          cmake --build --preset linux-release

      - name: Smoke test (start under Xvfb, stop with --quit)
        working-directory: build/linux-release
        shell: bash
        run: |
          cat > smoke.sh <<'SMOKE'
          set -euo pipefail
          # A config.ini next to the binary puts the app in portable mode, so the
          # run never touches the user settings. With file/format set the first-run
          # options dialog is skipped; tray=false needs no system tray; the updater
          # is disabled so the smoke makes no network calls.
          shots="$(mktemp -d)"
          printf '[file]\nformat=0\nenabled=true\ntarget=%s\n\n[options]\ntray=false\ndisableUpdater=true\n' "$shots" > config.ini
          ./lightscreen &
          pid=$!
          sleep 2
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "lightscreen exited before --quit was sent"
            wait "$pid" || true
            exit 1
          fi
          # SingleApplication forwards the argument to the running instance.
          ./lightscreen --quit
          for _ in $(seq 1 100); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 0.1
          done
          if kill -0 "$pid" 2>/dev/null; then
            echo "lightscreen did not exit within 10 seconds of --quit"
            kill -9 "$pid"
            exit 1
          fi
          status=0
          wait "$pid" || status=$?
          echo "lightscreen exit status: $status"
          [ "$status" -eq 0 ] || exit "$status"
          # Bug 29: with no instance running, --quit must exit instead of staying up hidden.
          status=0
          timeout 10 ./lightscreen --quit || status=$?
          if [ "$status" -ne 0 ]; then
            echo "lightscreen --quit with no instance running did not exit cleanly (status $status, 124 is a timeout)"
            exit 1
          fi
          SMOKE
          xvfb-run -a bash smoke.sh

      - name: Hotkey smoke (Print Screen under Xvfb saves a screenshot)
        working-directory: build/linux-release
        shell: bash
        run: |
          cat > hotkey-smoke.sh <<'SMOKE'
          set -euo pipefail
          # Same portable config as the smoke test, plus the whole-screen action on
          # Print. xdotool sends the key through the X server, so this exercises the
          # UGlobalHotkeys key grab and its native event filter end to end.
          shots="$(mktemp -d)"
          printf '[file]\nformat=0\nenabled=true\ntarget=%s\n\n[options]\ntray=false\ndisableUpdater=true\n\n[actions]\nscreen\\enabled=true\nscreen\\hotkey=Print\n' "$shots" > config.ini
          ./lightscreen &
          pid=$!
          sleep 2
          xdotool key Print
          found=""
          for _ in $(seq 1 100); do
            found="$(find "$shots" -name '*.png' -print -quit)"
            [ -n "$found" ] && break
            sleep 0.1
          done
          ./lightscreen --quit
          status=0
          wait "$pid" || status=$?
          if [ -z "$found" ]; then
            echo "Print Screen did not save a screenshot within 10 seconds"
            exit 1
          fi
          echo "saved $found"
          [ "$status" -eq 0 ] || exit "$status"
          SMOKE
          xvfb-run -a bash hotkey-smoke.sh

      - name: Run tests (Xvfb)
        run: xvfb-run -a ctest --preset linux-release

  windows:
    name: Windows (Qt 6.8, MSVC)
    needs: docs
    if: needs.docs.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          # qtimageformats holds the WEBP plugin (qwebp), which windeployqt then ships.
          modules: qtimageformats
          cache: true

      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build (app and tests)
        shell: cmd
        run: |
          cmake --preset windows-msvc-release
          if errorlevel 1 exit /b 1
          cmake --build --preset windows-msvc-release
          if errorlevel 1 exit /b 1

      - name: Run tests (offscreen)
        shell: cmd
        run: ctest --preset windows-msvc-release

      # A test whose output does not reach ctest (it once came back empty) is run again on its own, with QtTest
      # writing to a file, and the file is printed.
      - name: Show the output of failed tests
        if: failure()
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $failed = 'build\windows-msvc-release\Testing\Temporary\LastTestsFailed.log'
          if (-not (Test-Path $failed)) { exit 0 }
          foreach ($line in Get-Content $failed) {
            $name = $line.Split(':')[1]
            $dir = "build\windows-msvc-release\tests\$name"
            Push-Location $dir
            & ".\$name.exe" -o "$name-output.txt,txt"
            Write-Host "== $name exited with $LASTEXITCODE"
            if (Test-Path "$name-output.txt") { Get-Content "$name-output.txt" }
            Pop-Location
          }

      - name: Deploy
        shell: cmd
        run: |
          mkdir deploy
          copy build\windows-msvc-release\lightscreen.exe deploy\
          windeployqt --release --no-translations deploy\lightscreen.exe
          if errorlevel 1 exit /b 1
          if not exist deploy\imageformats\qwebp.dll (echo ::error::qwebp.dll was not deployed & exit /b 1)

      # oxipng.exe and optipng.exe, pinned and hash-checked, with their licences (same script as the release).
      - name: Add the PNG optimizers
        shell: pwsh
        run: .github\scripts\fetch-optimizers.ps1 -Destination deploy

      # The runner has a real desktop: the deployed app starts in the tray, a hotkey pressed from outside saves a
      # whole-screen PNG (bug 33), and --quit ends it. Runs on a copy, so the artifact stays clean.
      - name: Windows smoke
        shell: powershell
        run: .github\scripts\windows-smoke.ps1 -App deploy -Work smoke

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: lightscreen-win64
          path: deploy/
          if-no-files-found: error
