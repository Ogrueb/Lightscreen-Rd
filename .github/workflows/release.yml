name: Release

# A v* tag builds the Windows package and creates a *draft* GitHub Release with
# the zip attached; the owner writes the notes and publishes it by hand.
# workflow_dispatch is a dry run: same build, a draft pre-release under a
# dry-run-<run> tag that must be deleted, never published. A pull request that
# changes this file runs the build and the zip only, so the workflow is checked
# before it reaches master. Do not push a real tag before the rename (M16).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/release.yml']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Windows package (Qt 6.8, MSVC)
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      zip: ${{ steps.version.outputs.zip }}
    steps:
      - uses: actions/checkout@v5

      - name: Read the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^project\([A-Za-z0-9_]+ VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)"
          if [ -z "$version" ]; then
            echo "::error file=CMakeLists.txt::no project(... VERSION ...) line found"
            exit 1
          fi
          # A tag must name the version being built (v2.5 and v2.5.0 both match 2.5),
          # since the update check compares the tag with the version compiled in.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            normalize() { local v="$1"; while [[ "$v" == *.0 ]]; do v="${v%.0}"; done; echo "$v"; }
            tag="${GITHUB_REF_NAME#v}"
            if [ "$(normalize "$tag")" != "$(normalize "$version")" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match the version in CMakeLists.txt ($version)"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zip=lightscreen-rd-$version-win64.zip" >> "$GITHUB_OUTPUT"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          # qtimageformats holds the WEBP plugin (qwebp), which windeployqt then ships.
          modules: qtimageformats
          cache: true

      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build (app and tests)
        shell: cmd
        run: |
          cmake --preset windows-msvc-release
          if errorlevel 1 exit /b 1
          cmake --build --preset windows-msvc-release
          if errorlevel 1 exit /b 1

      - name: Run tests (offscreen)
        shell: cmd
        run: ctest --preset windows-msvc-release

      - name: Deploy and zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "lightscreen-rd-${{ steps.version.outputs.version }}-win64"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item build\windows-msvc-release\lightscreen.exe $dir\
          windeployqt --release --no-translations "$dir\lightscreen.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "$dir\imageformats\qwebp.dll")) { throw 'qwebp.dll was not deployed' }
          # oxipng.exe and optipng.exe, pinned and hash-checked, with their licences.
          .github\scripts\fetch-optimizers.ps1 -Destination $dir
          # The zip holds one top-level folder named like the zip.
          Compress-Archive -Path $dir -DestinationPath "${{ steps.version.outputs.zip }}"

      # Unpacks the zip as a user would and checks what is in it, then runs the app from it (start, a hotkey from the
      # tray saves a screenshot, --quit).
      - name: Check the zip
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "lightscreen-rd-${{ steps.version.outputs.version }}-win64"
          Expand-Archive "${{ steps.version.outputs.zip }}" -DestinationPath unpacked
          $top = @(Get-ChildItem unpacked)
          if ($top.Count -ne 1 -or $top[0].Name -ne $dir) { throw "the zip should hold exactly one folder $dir, it holds: $($top.Name -join ', ')" }
          $expected = 'lightscreen.exe', 'Qt6Core.dll', 'Qt6Gui.dll', 'Qt6Widgets.dll', 'Qt6Network.dll', 'Qt6Sql.dll',
                      'platforms\qwindows.dll', 'imageformats\qwebp.dll', 'sqldrivers\qsqlite.dll', 'tls',
                      'oxipng.exe', 'optipng.exe', 'licenses\oxipng', 'licenses\optipng'
          $missing = $expected | Where-Object { -not (Test-Path "unpacked\$dir\$_") }
          if ($missing) { throw "missing from the zip: $($missing -join ', ')" }
          .github\scripts\windows-smoke.ps1 -App "unpacked\$dir" -Work smoke

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.version.outputs.zip }}
          path: ${{ steps.version.outputs.zip }}
          if-no-files-found: error

  release:
    name: Draft release
    needs: package
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: ${{ needs.package.outputs.zip }}

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.package.outputs.version }}
          ZIP: ${{ needs.package.outputs.zip }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            gh release create "$GITHUB_REF_NAME" "$ZIP" --draft --verify-tag \
              --title "Lightscreen Rd $VERSION" \
              --notes "Draft created by the release workflow. Write the release notes, then publish."
          else
            # Dry run: a draft under a tag that does not match v*. GitHub creates the
            # tag only when a release is published; delete this draft instead.
            gh release create "dry-run-$GITHUB_RUN_NUMBER" "$ZIP" --draft --prerelease \
              --target "$GITHUB_SHA" \
              --title "Dry run $GITHUB_RUN_NUMBER (Lightscreen Rd $VERSION, $GITHUB_REF_NAME)" \
              --notes "Dry run of the release workflow from $GITHUB_SHA. Delete this draft; do not publish it."
          fi
