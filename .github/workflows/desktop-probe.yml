# One-off probe: does a GitHub-hosted Windows runner give a job a real desktop (hotkeys, input, window capture)?
# Decides whether a Windows UI smoke test is possible in CI. Results go to the job summary and the artifact.
name: Desktop probe

on:
  push:
    branches: [claude/beautiful-cori-lucvvf]
    paths: ['.github/workflows/desktop-probe.yml', '.github/scripts/desktop-probe.ps1']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # The Windows package of master's latest CI run at the time (0322673, run 40018160949).
      - name: Download Lightscreen Rd
        uses: actions/download-artifact@v4
        with:
          name: lightscreen-win64
          path: app
          run-id: 40018160949
          github-token: ${{ github.token }}

      - name: Probe
        shell: powershell
        run: .github\scripts\desktop-probe.ps1 -App app -Out probe-output

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: desktop-probe
          path: probe-output/
